<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmileCare - Dental Clinic</title>

    <meta
    name="description"
    content="SmileCare is a smart dental clinic management system for managing patients, appointments, doctors, medical records and online appointment booking."
>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="stylesheet" href="assets/css/login.css">

</head>

<body>

<div class="container">

    <!-- القسم الأيسر -->
    <div class="left-side">

        <h1>Smart Dental Clinic</h1>

        <p>
            Modern Management System for Dental Clinics
        </p>

        <div class="circle">

            <img
                src="C:\Users\PC\Desktop\خلفية\lamp_tree_miniature_122836_1280x720.jpg"
                alt="SmileCare"
            >

        </div>

    </div>


    <!-- القسم الأيمن -->
    <div class="right-side">

        <div class="login-card">

            <h2>Welcome Back</h2>

            <p>
                Please login to continue
            </p>


            <!-- تسجيل دخول الموظفين -->
            <form id="loginForm">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <!-- فاصل -->
            <div class="booking-divider">
                <span>OR</span>
            </div>


            <!-- حجز موعد للمريض -->
            <div class="patient-booking">

                <p class="booking-question">
                    Are you a patient?
                </p>

                <a
                    href="pages/online-booking.html"
                    class="booking-button"
                >
                    📅 Book an Appointment
                </a>

            </div>

        </div>

    </div>

</div>


<script src="assets/js/login.js"></script>

</body>

</html>
