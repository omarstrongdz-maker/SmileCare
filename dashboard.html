<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

   <link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
    

</head>

<body>
<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            🦷 <span>SmileCare</span>
        </div>

        <nav class="menu">

            <a href="dashboard.html" class="active">Dashboard</a>
<a href="pages/patients.html">Patients</a>
<a href="pages/doctors.html">Doctors</a>
<a href="pages/appointments.html">Appointments</a>
<a href="pages/dental-chart.html">Dental Chart</a>
<a href="pages/medical-records.html">Medical Records</a>
<a href="pages/payments.html">Payments</a>
<a href="pages/reports.html">Reports</a>
<a href="pages/settings.html">Settings</a>

        </nav>

    </aside>

    <!-- Main Content -->
    <main class="content">

        <header class="topbar">

            <h1>Dashboard</h1>

            <div class="user">
                Omar
            </div>

        </header>
<section class="cards">

    <div class="card">

    <div class="card-header">
        <h3>Patients</h3>
        <div class="card-icon">👤</div>
    </div>

    <p id="patientsCount">0</p>

</div>

    <div class="card">

    <div class="card-header">
        <h3>Doctors</h3>
        <div class="card-icon">🩺</div>
    </div>

    <p id="doctorsCount">0</p>

</div>

    <div class="card">

    <div class="card-header">
        <h3>Appointments</h3>
        <div class="card-icon">📅</div>
    </div>

    <p id="appointmentsCount">0</p>

</div>

    <div class="card">

    <div class="card-header">
        <h3>Revenue</h3>
        <div class="card-icon">💰</div>
    </div>

    <p id="revenueCount">0 DA</p>

</div>

</section>
<section class="dashboard-grid">

    <!-- Today's Appointments -->
    <div class="panel">

        <h2>Today's Appointments</h2>

       <table>

    <thead>
        <tr>
            <th>Patient</th>
            <th>Time</th>
        </tr>
    </thead>

    <tbody id="todayAppointments">

    </tbody>

</table>

    </div>

    <!-- Recent Patients -->

    <div class="panel">

        <h2>Recent Patients</h2>

       <ul id="recentPatients">

</ul>
    </div>

</section>
    </main>

</div>
<script src="assets/js/dashboard.js"></script>
</body>

</html>
